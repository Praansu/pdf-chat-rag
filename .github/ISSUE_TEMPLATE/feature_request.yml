name: Feature Request
description: Suggest a new feature or improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      placeholder: "Currently the app can't..."
    required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: "Add a new endpoint that..."
    required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (nice to have)
        - Medium (would improve UX)
        - High (blocking a use case)
    required: true